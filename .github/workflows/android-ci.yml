name: Mooazb AI Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d" >> "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" >> "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            set +o pipefail
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Decoded debug.keystore from repository debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated ephemeral debug.keystore (set DEBUG_KEYSTORE_BASE64 secret for a fixed SHA-1)."
          fi
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "^\s*SHA1:" | awk '{print $2}')
          SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "^\s*SHA256:" | awk '{print $2}')
          echo "Debug Keystore SHA-1: ${SHA1}"
          echo "Debug Keystore SHA-256: ${SHA256}"
          {
            echo "### Debug Signing Fingerprints"
            echo "- **SHA-1**: \`${SHA1}\`"
            echo "- **SHA-256**: \`${SHA256}\`"
            if [ -z "${DEBUG_KEYSTORE_BASE64}" ] && [ ! -f debug.keystore.base64 ]; then
              echo "- **Note**: Built with an ephemeral keystore. Add \`DEBUG_KEYSTORE_BASE64\` in GitHub Secrets (matching \`51:8D:04:1F:FC:14:41:D5:0B:A7:43:22:09:3F:71:4B:25:F1:13:EB\`) or register the SHA-1 above in Firebase Console for Google Sign-In."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore google-services.json if secret is provided
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          fi

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk-${{ runner.os }}-16-13921718-i7

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mooazb-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  firestore-rules:
    name: Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ephemeral Firebase test dependencies
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase-tools

      - name: Run Firestore security rules tests
        run: npx firebase emulators:exec --project demo-no-project --only firestore "node --test firestore.test.js"
